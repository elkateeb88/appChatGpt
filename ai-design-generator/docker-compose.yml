version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: design_db
    environment:
      POSTGRES_USER: designgen
      POSTGRES_PASSWORD: designgen_password
      POSTGRES_DB: designgen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designgen -d designgen"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: design_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://designgen:designgen_password@db:5432/designgen
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FREEPIK_API_KEY=${FREEPIK_API_KEY:-}
      - STORAGE_PATH=/app/storage
      - DEBUG=false
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: design_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
